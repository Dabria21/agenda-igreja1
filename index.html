<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda de Eventos - Igreja Batista Independente</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Agenda de Eventos - Igreja Batista Independente</h1>

  <div class="form-container">
    <input type="date" id="data" />
    <input type="time" id="hora" />
    <input type="text" id="descricao" placeholder="Descrição do evento" />
    <button id="adicionar">Adicionar Evento</button>
  </div>

  <h2>📅 Próximos Eventos</h2>
  <ul id="lista-eventos"></ul>

  <script type="module" src="script.js"></script>
</body>
</html>
